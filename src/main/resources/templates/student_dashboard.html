<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Complaints')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-4">
  <div th:replace="~{fragments :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>My Complaints</h3>
    <a th:href="@{/complaint/new}" class="btn btn-primary">+ New Complaint</a>
  </div>

  <div th:if="${#lists.isEmpty(complaints)}" class="alert alert-info">
    You haven't submitted any complaints yet.
  </div>

  <div th:unless="${#lists.isEmpty(complaints)}" class="table-responsive">
    <table class="table table-striped align-middle">
      <thead class="table-light">
        <tr><th>ID</th><th>Category</th><th>Description</th><th>Priority</th><th>Status</th><th>Submitted</th></tr>
      </thead>
      <tbody>
        <tr th:each="c : ${complaints}">
          <td th:text="${c.displayId()}">CMP-0001</td>
          <td th:text="${c.category()}">Category</td>
          <td th:text="${c.description()}">Description</td>
          <td th:text="${c.priority()}">Medium</td>
          <td>
            <span class="badge"
                  th:classappend="${c.status() == 'Resolved' ? 'bg-success' : (c.status() == 'In Progress' ? 'bg-info text-dark' : 'bg-warning text-dark')}"
                  th:text="${c.status()}">Pending</span>
          </td>
          <td th:text="${#temporals.format(c.createdAt(), 'dd MMM yyyy, HH:mm')}">Date</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
