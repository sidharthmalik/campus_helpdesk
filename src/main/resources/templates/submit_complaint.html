<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New Complaint')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-4">
  <div th:replace="~{fragments :: alerts}"></div>
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm"><div class="card-body p-4">
        <h3 class="mb-3">Submit a Complaint</h3>
        <form method="post" th:action="@{/complaint/new}">
          <div class="mb-3"><label class="form-label">Category</label>
            <select name="category" class="form-select" required>
              <option value="">-- Select --</option>
              <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
            </select></div>
          <div class="mb-3"><label class="form-label">Description</label>
            <textarea name="description" rows="5" class="form-control" required></textarea></div>
          <button class="btn btn-primary">Submit</button>
          <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
        </form>
      </div></div>
    </div>
  </div>
</div>
</body>
</html>
