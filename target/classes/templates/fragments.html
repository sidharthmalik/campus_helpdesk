<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Campus Helpdesk'">Campus Helpdesk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Campus Helpdesk</a>
    <div class="d-flex align-items-center gap-2">
      <th:block th:if="${studentName != null}">
        <span class="text-white me-2" th:text="'Hi, ' + ${studentName}">Hi</span>
        <a class="btn btn-light btn-sm" th:href="@{/dashboard}">Dashboard</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
      </th:block>
      <th:block th:if="${adminName != null}">
        <span class="text-white me-2" th:text="'Admin: ' + ${adminName}">Admin</span>
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
      </th:block>
      <th:block th:if="${studentName == null and adminName == null}">
        <a class="btn btn-light btn-sm" th:href="@{/login}">Student Login</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/register}">Register</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/login}">Admin</a>
      </th:block>
    </div>
  </div>
</nav>

<div th:fragment="alerts">
  <div th:if="${msg != null}" th:class="'alert alert-' + ${msgType}" th:text="${msg}"></div>
  <div th:if="${param.required != null}" class="alert alert-warning">Please log in first.</div>
</div>

</body>
</html>
