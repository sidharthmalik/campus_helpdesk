<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container mt-4">
  <div th:replace="~{fragments :: alerts}"></div>
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm"><div class="card-body p-4">
        <h3 class="mb-3">Student Registration</h3>
        <form method="post" th:action="@{/register}">
          <div class="mb-3"><label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Password (min 6 chars)</label>
            <input type="password" name="password" class="form-control" minlength="6" required></div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
      </div></div>
    </div>
  </div>
</div>
</body>
</html>
